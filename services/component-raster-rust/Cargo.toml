[package]
name = "aqw-component-raster"
version = "0.1.0"
edition = "2021"
description = "Native Rust component-raster Lambda for AQW character rendering (resvg as a library)"
license = "Apache-2.0"
default-run = "aqw-component-raster"

[[bin]]
name = "aqw-component-raster"
path = "src/main.rs"

[dependencies]
lambda_runtime = "1.3"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
png = "0.18"
futures = "0.3"
thiserror = "2"
async-trait = "0.1"
# Note: resvg 0.48.1 is pinned to match the shared layered renderer image's
# `/opt/resvg/resvg` (built from the same source). A "text" build keeps
# FFDec font group rendering behavior identical to the CLI, and
# "raster-images" supports embedded bitmaps exactly like the CLI defaults.
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images", "svgz", "simd-blur"] }
usvg = "0.48.1"
tiny-skia = "0.11"
fast_image_resize = "6"
flate2 = "1"
tar = "0.4"
roxmltree = "0.20"
# ThorVG 1.1.1 (vendored C++ source under vendor/thorvg-sys-upstream, built
# with cc-rs) renders the same tight-page component SVGs through an alternate
# SVG backend. The safe crate is pinned 0.3.2 and the [patch] below replaces
# the registry source with the vendored 0.3.2+thorvg-1.1.1 build. Loaders are
# trimmed to svg/png (embedded bitmaps) + fonts (text); lottie/expressions and
# file-io are unused by the component SVGs we assemble.
thorvg-sys = { version = "0.3.2", default-features = false, features = ["vendored", "svg", "png", "fonts", "threads"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
resvg = { path = "vendor/resvg-upstream/crates/resvg" }
thorvg-sys = { path = "vendor/thorvg-sys-upstream" }
