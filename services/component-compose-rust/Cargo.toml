[package]
name = "aqw-component-compose"
version = "0.1.0"
edition = "2021"
description = "Native Rust component-compose Lambda for AQW character rendering"
license = "Apache-2.0"
default-run = "aqw-component-compose"

[[bin]]
name = "aqw-component-compose"
path = "src/main.rs"

[dependencies]
lambda_runtime = "1.3"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
png = "0.18"
fast_image_resize = "6"
futures = "0.3"
thiserror = "2"
async-trait = "0.1"
wide = "1.7"
zstd = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
