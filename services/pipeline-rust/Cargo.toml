[package]
name = "aqw-render-pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aqw-component-raster = { path = "../component-raster-rust", default-features = false }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sfn = "1"
aws-sdk-sqs = "1"
aws-sdk-dynamodb = "1"
aws-sdk-ssm = "1"
aws-sdk-lambda = "1"
lambda_runtime = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
flate2 = "1"
regex = "1"
html-escape = "0.2"
form_urlencoded = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images", "svgz", "simd-blur"] }

[dev-dependencies]
aqw-component-compose = { path = "../component-compose-rust" }

[patch.crates-io]
resvg = { path = "../component-raster-rust/vendor/resvg-upstream/crates/resvg" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
